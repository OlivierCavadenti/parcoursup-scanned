name: Déploiement GitHub Pages

on:
  push:
    branches: [main, claude/vigilant-brahmagupta-r7389g]
  workflow_dispatch:
  schedule:
    # rafraîchit les données ouvertes chaque lundi
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vérification des types
        run: pnpm typecheck

      - name: Tests unitaires et de conformité
        run: pnpm test

      # Nécessite que GitHub Pages soit activé (Settings → Pages → Source : GitHub Actions).
      # Sans cela, le build continue avec un chemin de base calculé et seul le déploiement échoue.
      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Import des données ouvertes (non bloquant)
        run: pnpm data:fetch

      - name: Build statique
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outcome == 'success' && steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outcome == 'success' && steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - name: Vérification des liens externes (avertissements)
        run: pnpm links:check
        continue-on-error: true
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outcome == 'success' && steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
